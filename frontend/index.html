  <main class="main">
    <div class="mobile-toolbar">
      <button class="mobile-hamburger" id="mobile-hamburger" data-action="toggleMobileMenu" aria-label="Open menu">&#9776;</button>
      <button class="mobile-nav-toggle" data-action="toggleMobileNavMode" aria-label="Switch nav mode" title="Icons / Menu">
        <svg class="icon-grid" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <svg class="icon-list" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
    <div class="search-bar">
      <input type="text" id="search" placeholder="Search nodes, packages, containers, CVEs...">
      <input type="text" id="search-version" placeholder="Version / Tag..." class="hidden">
    </div>
    <div id="filters" class="hidden mb-16 gap-8 flex-wrap">
      <select id="filter-type" class="f-filter-md">
        <option value="">All types</option>
        <option value="bare_metal">Bare Metal</option>
        <option value="vm">VM</option>
        <option value="host">Host</option>
        <option value="container">Container</option>
        <option value="bastion">Bastion</option>
        <option value="workstation">Workstation</option>
      </select>
      <select id="filter-severity" class="f-filter-md">
        <option value="">All severities</option>
        <option value="critical">Critical</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
      <select id="filter-target-type" class="f-filter-md">
        <option value="">All targets</option>
        <option value="package">Package</option>
        <option value="container">Container</option>
      </select>
      <select id="filter-source" class="f-filter-md">
        <option value="">All sources</option>
        <option value="trivy">Trivy</option>
        <option value="wazuh">Wazuh</option>
      </select>
      <select id="filter-kev" class="f-filter-md">
        <option value="">All CVEs</option>
        <option value="true" class="opt-kev">KEV only</option>
        <option value="false">Non-KEV</option>
      </select>
      <select id="filter-workflow" class="f-filter-md">
        <option value="">All workflow</option>
        <option value="open">open</option>
        <option value="acknowledged">acknowledged</option>
        <option value="in_progress">in progress</option>
        <option value="mitigated" class="text-green">mitigated</option>
        <option value="resolved" class="text-green">resolved</option>
        <option value="false_positive">false positive</option>
        <option value="accepted_risk">accepted risk</option>
      </select>
      <select id="filter-sort" class="f-filter-md">
        <option value="score">Sort: Score</option>
        <option value="cvss">Sort: CVSS</option>
        <option value="severity">Sort: Severity</option>
        <option value="exploited">Sort: KEV first</option>
        <option value="detected_at">Sort: Recent</option>
      </select>
      <input type="text" id="filter-node" placeholder="Search node..." class="f-node-filter">
      <input type="text" id="filter-package" placeholder="Filter package..." class="f-node-filter">
      <input type="text" id="filter-table" placeholder="Filter table..." class="f-node-filter">
    </div>
    <div id="content">
      <div class="loading">Loading...</div>
    </div>
  </main>

  <div class="detail-overlay" id="detail">
    <button class="expand-btn" data-action="toggleFullscreen" title="Toggle fullscreen">⛶</button>
    <button class="close-btn" data-action="closeDetail">&times;</button>
    <div id="detail-content"></div>
  </div>
</div>

<script type="module" src="/js/app.js"></script>

</html>
