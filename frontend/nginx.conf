server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types application/json text/css application/javascript text/plain;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API vers le container api
    location /api/ {
        # Cap body size — Ansible collect payloads stay well under this
        client_max_body_size 20m;
        proxy_pass http://cmdb_api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Forward Authelia headers
        proxy_set_header Remote-User $http_remote_user;
        proxy_set_header Remote-Name $http_remote_name;
        proxy_set_header Remote-Email $http_remote_email;
        proxy_set_header Remote-Groups $http_remote_groups;
        # Short browser cache for API responses
        add_header Cache-Control "private, max-age=5" always;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    # HSTS — Traefik terminates TLS; this tells the browser to stick to HTTPS for 1 year.
    # includeSubDomains safe because the CMDB is only served under one host.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # AI / TDM reservation — see /LICENSE-AI.md and /.well-known/tdmrep.json
    add_header X-Robots-Tag "noai, noimageai" always;
    add_header tdm-reservation "1" always;
    add_header Link "</LICENSE-AI.md>; rel=\"license\"" always;

    # robots.txt + ai.txt + well-known — must be reachable without auth/CSP friction
    location = /robots.txt {
        add_header Content-Type "text/plain; charset=utf-8";
        try_files $uri =404;
    }
    location = /ai.txt {
        add_header Content-Type "text/plain; charset=utf-8";
        try_files $uri =404;
    }
    location ^~ /.well-known/ {
        add_header Content-Type "application/json; charset=utf-8";
        try_files $uri =404;
    }

    # Service worker: must not be cached (browser checks for updates each navigation)
    location = /sw.js {
        add_header Cache-Control "no-store";
        add_header Service-Worker-Allowed "/";
    }

    # Cache static assets — JS/CSS: revalidate on each load (no content hashing)
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
    }
    location ~* \.(png|jpg|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
