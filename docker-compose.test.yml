services:
  postgres-test:
    image: postgres:18-trixie
    environment:
      POSTGRES_DB: cmdb_test
      POSTGRES_USER: cmdb_test
      POSTGRES_PASSWORD: cmdb_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
