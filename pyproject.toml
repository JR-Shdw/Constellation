[project]
name = "cmdb"
version = "0.1.0"
description = "CMDB — Infrastructure inventory and CVE tracking"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.coverage.run]
# Track async code paths through SQLAlchemy/greenlet context switches
concurrency = ["greenlet", "thread"]
omit = [
    "api/app/scheduler.py",       # background loop — not unit-testable
    "api/app/connectors/gitea.py", # external API client
    "api/app/connectors/gitlab.py",
    "api/app/connectors/gitlab_ci.py",
    "api/app/connectors/woodpecker.py",
    "api/app/connectors/registry.py",
    "api/app/utils/portainer.py",  # external API client
    "api/app/notify.py",           # Matrix/email — external services
]
